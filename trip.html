<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Trip Details | Divine Yatra</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--orange:#ed7908;--gold:#ffc04b;--maroon:#831d36;--ink:#17263d;--cream:#fffaf0;--muted:#687080}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Poppins,Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.7}a{text-decoration:none;color:inherit}.container{width:min(1100px,92%);margin:auto}.top{background:white;box-shadow:0 3px 18px #0001}.nav{min-height:74px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font:700 25px 'Playfair Display',serif;color:var(--maroon)}.btn{display:inline-block;border:0;border-radius:30px;padding:12px 20px;background:linear-gradient(135deg,var(--orange),#f0a000);color:white;font-size:13px;font-weight:600;cursor:pointer}.hero{color:white;background:linear-gradient(90deg,#101c2ee8,#101c2e55),var(--hero-image) center/cover;min-height:350px;display:flex;align-items:end;padding:45px 0}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700}.hero h1{font:700 clamp(38px,6vw,62px)/1.1 'Playfair Display',serif;margin:10px 0}.hero p{max-width:700px;color:#f1f1f1;font-size:14px}.hero-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{background:#ffffff24;border:1px solid #ffffff55;border-radius:25px;padding:7px 13px;font-size:12px}.layout{display:grid;grid-template-columns:1.65fr .8fr;gap:25px;padding:40px 0 70px}.panel{background:white;border:1px solid #f0e7da;border-radius:16px;padding:25px;margin-bottom:20px}.panel h2{font:700 27px 'Playfair Display',serif;margin-bottom:14px}.panel h3{font:700 20px 'Playfair Display',serif;margin-bottom:7px}.panel p,.panel li{font-size:13px;color:#626978}.highlights{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;list-style:none}.highlights li{background:#fff7e9;border-radius:9px;padding:11px}.timeline{list-style:none;position:relative}.timeline li{border-left:2px solid #f3c37a;padding:0 0 22px 20px;margin-left:7px;position:relative}.timeline li:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--orange);position:absolute;left:-6px;top:7px}.timeline li:last-child{padding-bottom:0}.timeline strong{display:block;color:var(--maroon);font-size:13px;margin-bottom:4px}.checklist{list-style:none}.checklist li{margin:8px 0}.checklist li:before{content:"✓";color:#14804a;font-weight:700;margin-right:9px}.exclude li:before{content:"–";color:var(--maroon)}.price-card{position:sticky;top:95px}.price{font:700 34px 'Playfair Display',serif;color:var(--maroon)}.muted{font-size:11px;color:var(--muted)}.line{height:1px;background:#eee5d9;margin:17px 0}.price-card .btn{width:100%;text-align:center;margin-top:13px}.notice{background:#fff4d9;border-radius:10px;padding:12px;font-size:11px;color:#70552a;margin-top:15px}.back{display:inline-block;margin:25px 0;color:var(--maroon);font-size:13px;font-weight:600}.notfound{text-align:center;padding:80px 15px}.notfound h1{font:700 36px 'Playfair Display',serif;margin-bottom:15px}footer{background:var(--ink);color:#c6ced8;text-align:center;padding:22px;font-size:11px}
@media(max-width:760px){.layout{grid-template-columns:1fr;padding-top:22px}.price-card{position:static;grid-row:1}.hero{min-height:310px}.panel{padding:20px}.highlights{grid-template-columns:1fr 1fr}}
</style></head><body>
<header class="top"><div class="container nav"><a class="brand" href="index.html">🪷 Divine Yatra</a><a class="btn" href="index.html#destinations">← All Destinations</a></div></header>
<div id="app"></div><footer>© <span id="year"></span> Divine Yatra · Sample itinerary and indicative prices; confirm all details before booking.</footer>
<script>
const trips={
"Kedarnath":{state:"Uttarakhand, India",tag:"Himalayan pilgrimage",image:"https://images.unsplash.com/photo-1626621341517-bbf3d9990a23?auto=format&fit=crop&w=1800&q=85",desc:"A mountain pilgrimage to the sacred Kedarnath Temple, dedicated to Lord Shiva.",days:"4–5 days",price:7999,highlights:["Kedarnath Temple darshan","Himalayan scenery","Gaurikund and trek planning"],itinerary:[["Day 1","Arrive in Haridwar or Rishikesh; overnight stay and route briefing."],["Day 2","Travel towards Guptkashi/Sonprayag; check local conditions and rest."],["Day 3","Proceed to Gaurikund and trek or use an authorised available option; temple darshan subject to access and weather."],["Day 4","Return from the trek area and travel back towards the departure city."],["Day 5 (if needed)","Buffer day for weather, road or transport delays."]],includes:["Suggested route planning","Trip coordination checklist","Accommodation and transport options to confirm"],excludes:["Personal expenses","Meals unless confirmed","Registration, permits or special transport unless confirmed"]},
"Varanasi":{state:"Uttar Pradesh, India",tag:"Sacred heritage",image:"https://images.unsplash.com/photo-1561361513-2d000a50f0dc?auto=format&fit=crop&w=1800&q=85",desc:"Discover ancient ghats, temple traditions and the evening Ganga Aarti in Varanasi.",days:"2–3 days",price:4999,highlights:["Kashi Vishwanath area","Dashashwamedh Ghat Ganga Aarti","Sunrise boat ride option"],itinerary:[["Day 1","Arrive, check in and explore the nearby ghats; attend Ganga Aarti if timings permit."],["Day 2","Visit the Kashi Vishwanath area and other selected temples; optional sunrise boat ride."],["Day 3 (optional)","Visit Sarnath or enjoy a relaxed morning before departure."]],includes:["Suggested sightseeing sequence","Local transport options to confirm","Flexible half-day planning"],excludes:["Boat tickets and temple-related fees unless confirmed","Meals and personal expenses","Flights or trains unless confirmed"]},
"Vaishno Devi":{state:"Katra, Jammu & Kashmir, India",tag:"Shakti pilgrimage",image:"https://images.unsplash.com/photo-1606293926075-69a00dbfde81?auto=format&fit=crop&w=1800&q=85",desc:"Plan a pilgrimage to the revered shrine of Shri Mata Vaishno Devi from Katra.",days:"2–3 days",price:3999,highlights:["Katra base town","Shrine trek planning","Rest time for families"],itinerary:[["Day 1","Arrive in Katra, check in, rest and complete required yatra registration."],["Day 2","Begin the shrine journey at your pace; darshan depends on registration, crowd and official arrangements."],["Day 3 (optional)","Rest, local visit and depart. Keep extra time for queues and weather."]],includes:["Suggested Katra stay plan","Journey checklist","Family-friendly timing suggestions"],excludes:["Yatra registration or special services unless confirmed","Meals and personal expenses","Helicopter or other transport tickets unless confirmed"]},
"Tirupati Balaji":{state:"Tirumala, Andhra Pradesh, India",tag:"Temple darshan",image:"https://images.unsplash.com/photo-1606293926075-69a00dbfde81?auto=format&fit=crop&w=1800&q=85",desc:"A devotional visit to the famous hill shrine of Lord Venkateswara at Tirumala.",days:"2–3 days",price:5999,highlights:["Tirumala temple visit","Darshan booking planning","Tirupati local temples"],itinerary:[["Day 1","Arrive in Tirupati, check in and review official darshan arrangements."],["Day 2","Travel to Tirumala and attend darshan according to confirmed ticket and queue timings."],["Day 3 (optional)","Visit selected local temples and depart."]],includes:["Suggested travel sequence","Stay and transfer options to confirm","Darshan preparation checklist"],excludes:["Darshan tickets or donations unless confirmed","Meals and personal expenses","Travel to Tirupati unless confirmed"]},
"Rameswaram":{state:"Tamil Nadu, India",tag:"Sacred coastal temple",image:"https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1800&q=85",desc:"Explore Ramanathaswamy Temple and the sacred coastal heritage of Rameswaram.",days:"2–3 days",price:6499,highlights:["Ramanathaswamy Temple","Temple corridors and rituals","Dhanushkodi excursion option"],itinerary:[["Day 1","Arrive and settle in; visit the temple area subject to opening hours."],["Day 2","Plan temple darshan and nearby sacred sites; optional Dhanushkodi visit if conditions allow."],["Day 3 (optional)","Relaxed morning and departure."]],includes:["Suggested sightseeing plan","Local transfer options to confirm","Time for temple visits"],excludes:["Ritual charges unless confirmed","Meals and personal expenses","Long-distance transport unless confirmed"]},
"Dwarka":{state:"Gujarat, India",tag:"Krishna's sacred land",image:"https://images.unsplash.com/photo-1477587458883-47145ed94245?auto=format&fit=crop&w=1800&q=85",desc:"Visit Dwarkadhish Temple and explore Gujarat's sacred coastal heritage.",days:"3–4 days",price:6999,highlights:["Dwarkadhish Temple","Bet Dwarka option","Nageshwar Jyotirlinga option"],itinerary:[["Day 1","Arrive in Dwarka and explore the town; check temple timings."],["Day 2","Visit Dwarkadhish Temple and nearby sacred sites."],["Day 3","Optional Nageshwar and Bet Dwarka excursion, depending on ferry and local conditions."],["Day 4 (optional)","Buffer time and departure."]],includes:["Suggested temple circuit","Local travel options to confirm","Flexible sightseeing schedule"],excludes:["Ferry and entry tickets unless confirmed","Meals and personal expenses","Transport to Dwarka unless confirmed"]},
"Char Dham":{state:"Uttarakhand, India",tag:"Sacred Himalayan circuit",image:"https://images.unsplash.com/photo-1626621341517-bbf3d9990a23?auto=format&fit=crop&w=1800&q=85",desc:"A longer Himalayan pilgrimage covering Yamunotri, Gangotri, Kedarnath and Badrinath.",days:"10–12 days",price:24999,highlights:["Yamunotri","Gangotri","Kedarnath","Badrinath"],itinerary:[["Days 1–2","Reach the region and travel towards the Yamunotri route; allow time for acclimatisation."],["Days 3–4","Visit Yamunotri and proceed towards the Gangotri route as conditions permit."],["Days 5–7","Visit Gangotri and continue towards the Kedarnath route; trek/access depends on official arrangements."],["Days 8–10","Plan Kedarnath darshan and proceed towards Badrinath with rest stops."],["Days 11–12","Badrinath visit and return journey; retain a buffer for mountain weather and road conditions."]],includes:["Suggested route and day sequence","Stay/transport options to confirm","Pre-trip checklist"],excludes:["Registration and permits unless confirmed","Meals and personal expenses","Helicopter, pony, palki or special services unless confirmed"]}
};
const money=n=>"₹"+n.toLocaleString("en-IN");
const params=new URLSearchParams(location.search);const name=params.get("destination")||"Kedarnath";const requestedDate=params.get("date")||"";const requestedPeople=params.get("people")||"";const trip=trips[name];const app=document.getElementById("app");document.getElementById("year").textContent=new Date().getFullYear();
if(!trip){app.innerHTML='<div class="container notfound"><h1>Trip not found</h1><p>Please choose a destination from our trip collection.</p><br><a class="btn" href="index.html#destinations">Explore all trips</a></div>'}
else{
app.innerHTML=`<section class="hero" style="--hero-image:url('${trip.image}')"><div class="container"><div class="eyebrow">${trip.tag}</div><h1>${name} Yatra</h1><p>${trip.desc}</p><div class="hero-meta"><span class="pill">📍 ${trip.state}</span><span class="pill">◷ ${trip.days}</span><span class="pill">🙏 Devotional journey</span></div></div></section>
<div class="container"><a class="back" href="index.html#destinations">← Back to all destinations</a><div class="layout"><div>
<section class="panel"><h2>Trip Overview</h2><p>${trip.desc} This is a suggested itinerary; actual routes, access, darshan availability and timing can change. Confirm details before travel.</p><br><h3>Trip Highlights</h3><ul class="highlights">${trip.highlights.map(x=>`<li>✦ ${x}</li>`).join("")}</ul></section>
<section class="panel"><h2>Suggested Day-by-Day Itinerary</h2><ol class="timeline">${trip.itinerary.map(x=>`<li><strong>${x[0]}</strong><p>${x[1]}</p></li>`).join("")}</ol></section>
<section class="panel"><h2>What may be included</h2><ul class="checklist">${trip.includes.map(x=>`<li>${x}</li>`).join("")}</ul><div class="line"></div><h3>Not included unless confirmed</h3><ul class="checklist exclude">${trip.excludes.map(x=>`<li>${x}</li>`).join("")}</ul></section>
<section class="panel"><h2>Before You Travel</h2><ul class="checklist"><li>Confirm travel dates, accommodation, transport and final quote in writing.</li><li>Check official temple timings, registration rules, weather and access updates.</li><li>Carry valid ID, prescribed medicines and comfortable clothing/footwear.</li><li>Keep buffer time for queues, road delays and changing conditions.</li></ul></section>
</div><aside><div class="panel price-card"><div class="eyebrow" style="color:var(--orange)">SAMPLE PACKAGE PRICE</div><div class="price">${money(trip.price)}</div><div class="muted">indicative estimate per person · not a live quote</div><div class="line"></div><p><strong>Duration:</strong> ${trip.days}</p><p><strong>Destination:</strong> ${name}</p><p><strong>Travel style:</strong> Family, private or group (on enquiry)</p><div class="notice">Final price and availability are not confirmed until the travel provider responds. This page does not make a reservation or collect payment.</div><a class="btn" id="enquireTrip" href="index.html#booking" style="margin-top:18px">Enquire About This Trip →</a><button class="btn" id="whatsappTrip" style="width:100%;margin-top:10px;background:#168a4a">Plan This Trip →</button></div></aside></div></div>`;
document.getElementById("enquireTrip").href="index.html?destination="+encodeURIComponent(name)+(requestedDate?"&date="+encodeURIComponent(requestedDate):"")+(requestedPeople?"&people="+encodeURIComponent(requestedPeople):"")+"#booking";document.getElementById("whatsappTrip").addEventListener("click",()=>{location.href="index.html?destination="+encodeURIComponent(name)+(requestedDate?"&date="+encodeURIComponent(requestedDate):"")+(requestedPeople?"&people="+encodeURIComponent(requestedPeople):"")+"#booking"});
}
// Keep search choices when the visitor moves from the home page to trip details.
if(trip){
 const enquiryUrl="index.html?destination="+encodeURIComponent(name)+(requestedDate?"&date="+encodeURIComponent(requestedDate):"")+(requestedPeople?"&people="+encodeURIComponent(requestedPeople):"")+"#booking";
 const enquiryLink=document.getElementById("enquireTrip"); if(enquiryLink) enquiryLink.href=enquiryUrl;
}
</script></body></html>
